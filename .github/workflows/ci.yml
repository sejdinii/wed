name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kapar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kapar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck + test domain package
        run: |
          npm run -w @kapar/domain typecheck
          npm run -w @kapar/domain test

      - name: Typecheck server
        run: npm run -w server typecheck

      - name: Migrate + seed
        run: |
          npm run -w server db:migrate
          npm run -w server db:seed

      - name: Server tests (against seeded db)
        run: npm run -w server test

      - name: Server boot smoke
        run: |
          npm run -w server start &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          count=$(curl -sf http://localhost:3000/v1/venues | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "venues served: $count"
          test "$count" -ge 14
